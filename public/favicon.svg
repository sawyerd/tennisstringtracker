<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#2D6A4F"/>
  <!-- Racket head: open oval, no fill so strings show through -->
  <ellipse cx="16" cy="12" rx="8" ry="9.5" fill="#2D6A4F" stroke="white" stroke-width="2"/>
  <!-- Horizontal strings: 3 lines, manually trimmed to stay inside oval -->
  <line x1="9"  y1="9.5" x2="23" y2="9.5"  stroke="white" stroke-width="1"/>
  <line x1="8"  y1="12"  x2="24" y2="12"   stroke="white" stroke-width="1"/>
  <line x1="9"  y1="14.5" x2="23" y2="14.5" stroke="white" stroke-width="1"/>
  <!-- Vertical strings: 3 lines, manually trimmed -->
  <line x1="13" y1="3"  x2="13" y2="21"  stroke="white" stroke-width="1"/>
  <line x1="16" y1="2.5" x2="16" y2="21.5" stroke="white" stroke-width="1"/>
  <line x1="19" y1="3"  x2="19" y2="21"  stroke="white" stroke-width="1"/>
  <!-- Re-draw oval on top to cleanly mask string overruns -->
  <ellipse cx="16" cy="12" rx="8" ry="9.5" fill="none" stroke="white" stroke-width="2"/>
  <!-- Throat -->
  <path d="M13.5 21.5 L14.2 25 L17.8 25 L18.5 21.5" fill="none" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
  <!-- Handle -->
  <rect x="14.2" y="24.5" width="3.6" height="5.5" rx="1.2" fill="white"/>
</svg>
